name: release

# Builds the Withy desktop client and publishes the installers as a GitHub
# Release you can download from this repo's Releases tab.
#
# Trigger:
#   git tag v1.0.0 && git push origin v1.0.0
#   …or run it manually from the Actions tab with a version input.
#
# This repo holds only the Electron shell. The UI it displays lives in the
# `tossa` repo (web/) and ships through that repo's own deploy pipeline — a
# release here never needs a web deploy, and a web deploy never needs a
# release here. See CLAUDE.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 (예: 1.0.1). 비우면 package.json 값을 씁니다.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS job covers both slices — Apple Silicon and Intel.
          - os: macos-latest
            label: macOS (arm64 + x64)
            args: --mac --arm64 --x64
          - os: windows-latest
            label: Windows (x64)
            args: --win --x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve version
        shell: bash
        run: |
          # Tag `v1.2.3` → 1.2.3. Manual runs can pass a version input.
          # Keeping package.json in sync matters: electron-builder stamps the
          # artifact filenames and the updater feed from it, so a drifting
          # version silently ships installers that never see each other.
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "Building Withy desktop $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install
        run: npm ci

      # The Google desktop client id/secret are injected here rather than
      # committed: an installed-app client must ship its secret inside the
      # binary, but GitHub push protection (correctly) refuses to take one into
      # a public repo's history. Without this step Google sign-in fails with
      # "client_secret is missing".
      - name: Write Google desktop credentials
        shell: bash
        env:
          WITHY_GOOGLE_CLIENT_ID: ${{ secrets.WITHY_GOOGLE_CLIENT_ID }}
          WITHY_GOOGLE_CLIENT_SECRET: ${{ secrets.WITHY_GOOGLE_CLIENT_SECRET }}
        run: node scripts/write-google-secret.js

      # Signed with the Developer ID cert (MAC_CSC_LINK) and notarized through
      # the App Store Connect API key. Both are mandatory: 1.0.0 shipped merely
      # ad-hoc signed, which satisfies Apple Silicon's exec requirement but is
      # still quarantined by Gatekeeper — the download simply would not open.
      # Fail the build rather than publish an installer nobody can use.
      #
      # The .p8 is stored base64-encoded because GitHub secrets mangle
      # multi-line values, and @electron/notarize wants a *path* — so it is
      # written to the runner temp dir (wiped with the job), never to the
      # workspace where upload-artifact could sweep it into a release.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set — the resulting app could not be installed on macOS. See README 서명."
              exit 1
            fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export APPLE_API_KEY="$KEY_PATH"
          npx electron-builder ${{ matrix.args }} --publish never
          rm -f "$KEY_PATH"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder ${{ matrix.args }} --publish never

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: withy-desktop-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Manual runs have no tag to attach to — fall back to a versioned one.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.0.{0}', github.run_number) }}
          name: Withy Desktop ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.run_number }}
          draft: false
          prerelease: false
          files: dist/*
          body: |
            ## 내려받기

            | 기기 | 파일 |
            |---|---|
            | Mac (Apple Silicon — M1 이상) | `Withy-<버전>-mac-arm64.dmg` |
            | Mac (Intel) | `Withy-<버전>-mac-x64.dmg` |
            | Windows 10/11 (설치형) | `Withy-Setup-<버전>.exe` |
            | Windows (설치 없이 실행) | `Withy-<버전>-portable.exe` |

            ### macOS
            Apple Developer ID로 서명하고 Apple 공증(notarization)까지 받았습니다.
            받아서 `/Applications` 에 넣고 그냥 열면 됩니다 — 터미널 명령이 필요 없습니다.

            ### Windows 첫 실행
            코드 서명 인증서가 없어 SmartScreen이 "알 수 없는 게시자"로 막습니다.
            **추가 정보 → 실행**을 누르세요.
